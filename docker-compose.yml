version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: accounting_user
      POSTGRES_PASSWORD: accounting_password
      POSTGRES_DB: accounting_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting_user -d accounting_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: accounting-saas-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
